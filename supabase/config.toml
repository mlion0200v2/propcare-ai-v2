# Supabase CLI configuration for local development (`npx supabase start`).
# Hosted projects are configured in the dashboard instead; see SETUP.md.
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "propcare"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project's Postgres major version (Dashboard → Settings → Infrastructure).
major_version = 17

[db.pooler]
enabled = false

[db.seed]
# `npx supabase db reset` runs migrations, then this demo seed.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local email testing (Mailpit): every email Supabase Auth sends locally is
# captured at http://127.0.0.1:54324 instead of being delivered.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Private bucket for tenant photos and videos (also created by the baseline
# migration, so hosted projects get it from `supabase db push`).
[storage.buckets.ticket-media]
public = false
file_size_limit = "25MiB"
allowed_mime_types = [
  "image/jpeg",
  "image/png",
  "image/webp",
  "image/heic",
  "video/mp4",
  "video/quicktime",
  "video/webm",
]

[auth]
enabled = true
site_url = "http://localhost:3000"
# Email links land on /auth/confirm (sign-up confirmation, tenant sign-in
# links, email changes).
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/confirm",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Tenants on a unit link get a guest session (RLS gives it nothing until a
# one-time code is confirmed). Use CAPTCHA on hosted projects.
enable_anonymous_sign_ins = true
enable_manual_linking = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 30
anonymous_users = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Landlords/managers must confirm their email before a workspace is created.
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

[analytics]
enabled = false
